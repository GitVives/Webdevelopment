<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/bootstrap.css">
    <title>My internet Start Page</title>
</head>
<body>
    <div class="container">
        <h1>My internet Start Page</h1>
        <input id="commandoField" type="text" name="commandoField" placeholder="Enter commando">

        <div id="history" class="row g-3"></div>
    </div>
<script type="text/javascript" charset="utf-8" src="scripts/code.js"></script>
</body>
